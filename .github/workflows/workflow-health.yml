name: Workflow health alerts

on:
  workflow_run:
    workflows:
      - Update Tailscale stable release
      - Docker image
      - Keep repository active
    types: [completed]
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: workflow-health-alerts
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile failure and recovery issues
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_ASSIGNEE: ${{ vars.WORKFLOW_ALERT_ASSIGNEE || github.repository_owner }}
        run: python3 scripts/workflow_health.py
